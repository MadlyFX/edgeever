name: Validate personal EdgeEver

on:
  push:
    branches:
      - personal/editor-enhancements
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-editor-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'MadlyFX/edgeever'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run regression tests
        run: bun run test
      - name: Lint
        run: bun run lint
      - name: Type check
        run: bun run typecheck
      - name: Type check mobile
        run: bun run typecheck:mobile
      - name: Build web
        run: bun run build:web
      - name: Build Worker
        run: bun run build:worker
